[workspace]
resolver = "3"
members = ["crates/core", "crates/api", "crates/config", "crates/store", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
tymy-core = { path = "crates/core" }
tymy-api = { path = "crates/api" }
tymy-config = { path = "crates/config" }
tymy-store = { path = "crates/store" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
oo7 = "0.6"
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "form", "query", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
